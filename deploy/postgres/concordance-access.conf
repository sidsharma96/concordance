# Include BEFORE general rules in PostgreSQL 16 pg_hba.conf.
# Only this login matches; preserve existing rules for other applications.
local concordance concordance_app scram-sha-256
local all concordance_app reject
host concordance concordance_app 127.0.0.1/32 scram-sha-256
host concordance concordance_app ::1/128 scram-sha-256
host all concordance_app 0.0.0.0/0 reject
host all concordance_app ::/0 reject
local replication concordance_app reject
host replication concordance_app 0.0.0.0/0 reject
host replication concordance_app ::/0 reject
